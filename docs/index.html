  <body>
    <script>
      // Dynamically load flutter.js then immediately start the app.
      // Appending ?v= to both files busts iOS Safari's aggressive cache
      // so every deploy is picked up without users needing to clear data.
      var _v = new Date().getTime();
      var _s = document.createElement("script");
      _s.src = "flutter.js?v=" + _v;
      _s.onload = function () {
        _flutter.loader.loadEntrypoint({
          entrypointUrl: "main.dart.js?v=" + _v,
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer.initializeEngine().then(function (appRunner) {
              appRunner.runApp();
            });
          },
        });
      };
      document.head.appendChild(_s);
    </script>
  </body>
</html>
