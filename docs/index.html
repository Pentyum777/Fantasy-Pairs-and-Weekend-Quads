<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Fantasy Pairs and Weekend Quads" />

    <!-- Correct base href for GitHub Pages subfolder -->
    <base href="/Fantasy-Pairs-and-Weekend-Quads/" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fantasy Pairs & Weekend Quads</title>

    <!-- MSAL -->
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

    <script>
      // Explicit redirect URI for MSAL (GitHub Pages subfolder)
      window.msalRedirectUri = window.location.origin + "/Fantasy-Pairs-and-Weekend-Quads/";
    </script>

    <!-- MSAL interop -->
    <script src="msal_interop.js"></script>

    <!-- Flutter Web JS loader -->
    <script src="flutter.js" defer></script>

    <!-- Disable caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>

  <body>
    <script>
      // Load Flutter app
      window.addEventListener("load", function () {
        _flutter.loader.loadEntrypoint({
          entrypointUrl: "main.dart.js",
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer.initializeEngine().then(function (appRunner) {
              appRunner.runApp();
            });
          },
        });
      });
    </script>
  </body>
</html>
