<!DOCTYPE html>
<html>
<head>
  <!-- MUST BE FIRST: disable analytics + stub ga4 -->
  <script>
    // Stub all analytics calls Flutter might try
    window.ga4 = function() {};
    window.gtag = function() {};
    window.dataLayer = window.dataLayer || [];

    // Disable Flutter Web analytics entirely
    self.flutterConfiguration = { analytics: false };
  </script>

  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="description" content="Fantasy Pairs" />

  <title>Fantasy Pairs</title>

  <!-- MSAL -->
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
  <script src="msal.js"></script>

  <!-- Flutter Web -->
  <meta name="flutter-service-worker" content="false">
  <base href="/Fantasy-Pairs-and-Weekend-Quads/">

  <meta name="flutter-web-renderer" content="html" />
  <meta name="flutter-web-auto-detect" content="false" />
</head>

<body>

  <!-- Cache‑busted flutter.js -->
  <script src="flutter.js?v={{BUILD_HASH}}" defer></script>

  <script>
    window.addEventListener('load', function () {
      _flutter.loader.loadEntrypoint({
        // Cache‑busted main.dart.js
        entrypointUrl: "main.dart.js?v={{BUILD_HASH}}",
        serviceWorker: { serviceWorkerVersion: null }
      })
      .then(function (engineInitializer) {
        return engineInitializer.initializeEngine();
      })
      .then(function (appRunner) {
        return appRunner.runApp();
      });
    });
  </script>

</body>
</html>
